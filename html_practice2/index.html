<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM</title>
    <style>
        body{
            margin: 0;
        }
        .container-head{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            text-align: center;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 10px;
        }

        .box{
            height: 200px;
            width: 15vw;
            border: black solid 2px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            font-size: 30px;
        }

        button{
            font-size: 15px;
            border: black solid 1px;
            border-radius: 5px;
            padding: 8px 10px;
        }
        button:hover{
            transform: translateY(-1px);
            border: solid 2px;
            transition: all 200ms;
        }
        button:active{
            transform: translateY(1px);
            transition: all 1ms;
        }
    </style>
</head>
<body>

    <div class="container-head">
        <p>Press the button, assign random color to boxes.</p>
    </div>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>

    <div class="container">
        <button id="chngColor" onclick="chngColor()">Change Color</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
